name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust 1.98.1
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Rust toolchain identity
        run: |
          rustc --version --verbose
          cargo --version

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --all-targets

      - name: Rust release smoke test
        run: cargo run --locked --release

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'

      - name: Python toolchain identity
        run: python --version

      - name: Install research verifier dependencies
        run: python -m pip install -r requirements-research.txt

      - name: Compile research harness
        run: >-
          python -m py_compile
          tools/verify_math.py
          tools/symbolic_mu2.py
          tools/proof_ledger.py
          tools/riemann_research_agent.py
          tools/riemann_dual_research_agent.py
          tools/symbolic_mu2_agent_extension.py
          tools/riemann_symbolic_research_agent.py
          tools/riemann_dual_symbolic_research_agent.py
          tools/test_verify_math.py
          tools/test_symbolic_mu2.py
          tools/test_proof_ledger.py
          tools/test_symbolic_agent_extension.py
          tools/test_symbolic_dual_gate.py

      - name: Research harness regression tests
        run: >-
          python -m unittest -v
          tools/test_verify_math.py
          tools/test_symbolic_mu2.py
          tools/test_proof_ledger.py
          tools/test_symbolic_agent_extension.py
          tools/test_symbolic_dual_gate.py
